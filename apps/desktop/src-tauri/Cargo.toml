[package]
name = "sonicmirror-desktop"
description = "SonicMirror desktop application"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "sonicmirror_desktop_lib"
# Desktop only: the cdylib/staticlib outputs are needed for mobile targets.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde.workspace = true
sonic-core.workspace = true
sonic-catalog.workspace = true
sonic-runtime.workspace = true
tauri-plugin-dialog = "2"

[lints]
workspace = true
