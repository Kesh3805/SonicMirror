[workspace]
resolver = "3"
members = [
    "crates/sonic-core",
    "crates/sonic-catalog",
    "crates/sonic-runtime",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/Kesh3805/SonicMirror"
rust-version = "1.85"

[workspace.dependencies]
sonic-core = { path = "crates/sonic-core" }
sonic-catalog = { path = "crates/sonic-catalog" }
sonic-runtime = { path = "crates/sonic-runtime" }

thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
cast_precision_loss = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
